name: CI Pipeline

on:
  push:
    branches: [main, devlm]
  pull_request:
    branches: [main, devlm]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Linting & Unit Tests
  # ---------------------------------------------------------------------------
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vaultrag_db
          POSTGRES_USER: vaultrag_app
          POSTGRES_PASSWORD: vaultrag_secure_password_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check backend/

      - name: Run Django Tests
        env:
          DJANGO_SECRET_KEY: ci-testing-secret-key-vaultrag-2026
          DJANGO_DEBUG: True
          DJANGO_SETTINGS_MODULE: config.settings.dev
          POSTGRES_DB: vaultrag_db
          POSTGRES_USER: vaultrag_app
          POSTGRES_PASSWORD: vaultrag_secure_password_dev
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          cd backend
          python manage.py migrate
          python manage.py test accounts tenants documents

  # ---------------------------------------------------------------------------
  # 2. Frontend Linting & Type Check
  # ---------------------------------------------------------------------------
  frontend-checks:
    name: Frontend Lint & TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Run ESLint
        working-directory: ./frontend
        run: |
          npm run lint
